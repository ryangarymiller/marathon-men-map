<style>
/* Layout concept: a case-file index. Chrome is monochrome ink on cool paper so that colour means exactly one thing:
   claim status (green/blue/amber/red/grey/purple). Desktop = top tabs + right drawer; phone = bottom tabs + bottom sheet. */
:root{
  --bg:#e9ecf1; --surface:#ffffff; --surface2:#f3f5f8; --ink:#10151c; --ink2:#38404d; --ink3:#566071;
  --line:#d3d8e0; --line2:#b4bcc8; --focus:#1559d6; --shadow:0 1px 2px rgba(16,21,28,.08),0 6px 22px rgba(16,21,28,.10);
  --est-bg:#16703c; --est-fg:#ffffff;
  --rep-bg:#1c55b0; --rep-fg:#ffffff;
  --dis-bg:#f0b02e; --dis-fg:#2a1c00;
  --con-bg:#b3261e; --con-fg:#ffffff;
  --pod-fg:#414a58; --pod-bd:#6f7988;
  --spe-fg:#6528bf; --spe-bg:#f4edff; --spe-bd:#7b3fd6;
  --tA-bg:#10151c; --tA-fg:#ffffff; --tB-bg:#4a5463; --tB-fg:#ffffff; --tC-bg:#a6afbd; --tC-fg:#10151c; --tD-fg:#38404d;
  --t-person:#3f66c9; --t-org:#c06a14; --t-place:#1f8a73; --t-document:#6b7586; --t-event:#b23d83; --t-media:#8656c4; --t-object:#8e7a1c;
  --e-fam:#38404d; --e-red:#b3261e; --e-thin:#6b7586; --e-dot:#566071; --e-other:#aab2bf;
  --map-bg:#c9d8e6; --map-land:#f2efe8; --map-border:#b3aa9b; --map-coast:#8fa9c2; --map-river:#9fbcd8; --map-road:#d8a65f; --map-label:#4f5864; --map-label-strong:#3a4250;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  --navh:60px;
  --headh:52px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --surface:#161b23; --surface2:#1d242e; --ink:#e8ecf2; --ink2:#c0c8d4; --ink3:#97a2b3;
    --line:#2b3441; --line2:#434e5e; --focus:#7aa7ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.45);
    --est-bg:#3cb774; --est-fg:#04150b; --rep-bg:#6a9fff; --rep-fg:#04122b; --dis-bg:#f0b02e; --dis-fg:#2a1c00;
    --con-bg:#ff7468; --con-fg:#2b0500; --pod-fg:#c0c8d4; --pod-bd:#7c8798;
    --spe-fg:#cbb0ff; --spe-bg:#2a1d44; --spe-bd:#a883f2;
    --tA-bg:#e8ecf2; --tA-fg:#0d1117; --tB-bg:#97a2b3; --tB-fg:#0d1117; --tC-bg:#4a5565; --tC-fg:#e8ecf2; --tD-fg:#c0c8d4;
    --t-person:#7b9cf0; --t-org:#e8913a; --t-place:#4fc4a8; --t-document:#98a3b5; --t-event:#e077b3; --t-media:#b48cf0; --t-object:#cdb94a;
    --e-fam:#c0c8d4; --e-red:#ff7468; --e-thin:#8a95a6; --e-dot:#97a2b3; --e-other:#4a5565;
    --map-bg:#0f1720; --map-land:#1e2630; --map-border:#3d4756; --map-coast:#35506d; --map-river:#2c4a68; --map-road:#6e5634; --map-label:#9aa6b7; --map-label-strong:#b8c2d0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b23; --surface2:#1d242e; --ink:#e8ecf2; --ink2:#c0c8d4; --ink3:#97a2b3;
  --line:#2b3441; --line2:#434e5e; --focus:#7aa7ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.45);
  --est-bg:#3cb774; --est-fg:#04150b; --rep-bg:#6a9fff; --rep-fg:#04122b; --dis-bg:#f0b02e; --dis-fg:#2a1c00;

  --t-person:#7b9cf0; --t-org:#e8913a; --t-place:#4fc4a8; --t-document:#98a3b5; --t-event:#e077b3; --t-media:#b48cf0; --t-object:#cdb94a;
  --e-fam:#c0c8d4; --e-red:#ff7468; --e-thin:#8a95a6; --e-dot:#97a2b3; --e-other:#4a5565;

}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
#top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;
  padding:env(safe-area-inset-top,0px) var(--gutr) 0 var(--gut);min-height:var(--headh);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:none}
.brand h1{font:700 1.45rem/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand .sub{font:500 .72rem/1 var(--f-mono);color:var(--ink3);white-space:nowrap}
#tabs{display:flex;align-items:stretch;gap:2px;margin-left:auto;align-self:stretch}
.tab{appearance:none;border:0;background:none;display:flex;align-items:center;gap:7px;padding:0 14px;color:var(--ink2);
  font:600 .98rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;position:relative;min-height:44px}
.tab .ic{width:17px;height:17px}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--ink)}
#legendbar{flex:none;background:var(--surface2);border-bottom:1px solid var(--line);padding:6px var(--gutr) 6px var(--gut);
  display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;position:relative;z-index:20}
#legendbar .lg-title{font:600 .68rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
#legendbar .lg-chips{display:flex;flex-wrap:wrap;gap:6px}
#legendbar .lg-tiers{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.75rem;color:var(--ink3)}
#legToggle{display:none}
#body{flex:1;min-height:0;display:flex;position:relative}
#views{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);contain:paint;z-index:0}
/* the open view sits on top with an opaque background: mobile Chrome can leave the timeline's sticky layers painted after
   a switch, and paint containment plus stacking keeps any such leftovers underneath the new view */
.view:not([hidden]){z-index:1}
.view[hidden]{display:none}
.page{max-width:1240px;margin:0 auto;padding:22px var(--gutr) 40px var(--gut);display:flex;flex-direction:column;gap:30px}
.foot{font:400 .78rem/1.5 var(--f-mono);color:var(--ink3);padding-top:6px;border-top:1px solid var(--line)}
#gfoot{display:none;flex:none;padding:4px var(--gutr) 4px var(--gut);background:var(--surface);font-size:.72rem;position:relative;z-index:31}

/* ---------- badges, chips ---------- */
.badge{display:inline-flex;align-items:center;gap:.38em;padding:.2em .6em .2em .42em;border-radius:4px;border:1.5px solid transparent;
  font:600 .72rem/1.25 var(--f-body);letter-spacing:.02em;white-space:nowrap;flex:none}
.badge .ic{width:1.1em;height:1.1em}
.badge.est{background:var(--est-bg);color:var(--est-fg)}
.badge.rep{background:var(--rep-bg);color:var(--rep-fg)}
.badge.dis{background:var(--dis-bg);color:var(--dis-fg)}
.badge.con{background:var(--con-bg);color:var(--con-fg)}
.badge.pod{background:transparent;color:var(--pod-fg);border-color:var(--pod-bd)}
.badge.spe{background:var(--spe-bg);color:var(--spe-fg);border:1.5px dashed var(--spe-bd);font-style:italic}
.badge.lg{font-size:.82rem}
.dots{display:inline-flex;gap:3px;align-items:center;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3);box-sizing:border-box}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.tier{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:3px;font:600 .72rem/1 var(--f-mono);flex:none}
.tier.A{background:var(--tA-bg);color:var(--tA-fg)}
.tier.B{background:var(--tB-bg);color:var(--tB-fg)}
.tier.C{background:var(--tC-bg);color:var(--tC-fg)}
.tier.D{background:transparent;color:var(--tD-fg);border:1.5px solid var(--tD-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  border-radius:16px;padding:3px 10px;font-size:.8rem;line-height:1.35;max-width:100%;min-height:28px}
button.chip:hover{background:var(--surface2);border-color:var(--ink3)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.plain{background:var(--surface2);border-color:var(--line);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.off-tag{font:600 .66rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink3);color:var(--ink2);padding:3px 6px;border-radius:3px}
.mix{display:flex;height:6px;border-radius:2px;overflow:hidden;background:var(--line);min-width:28px}
.mix i{display:block;height:100%}
.mix .m-est{background:var(--est-bg)}.mix .m-rep{background:var(--rep-bg)}.mix .m-dis{background:var(--dis-bg)}
.mix .m-con{background:var(--con-bg)}.mix .m-pod{background:var(--pod-bd)}.mix .m-spe{background:var(--spe-bd)}
.mix.empty{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}

/* ---------- buttons & form controls ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border:1px solid var(--line2);
  background:var(--surface);border-radius:6px;font-weight:500;font-size:.88rem;color:var(--ink)}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn.sm{min-height:36px;padding:0 11px;font-size:.82rem}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:0;width:44px}
.btn.sm.icon{width:36px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],input[type=text],select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:6px;min-height:44px;padding:0 12px;min-width:0}
select{padding-right:6px}
input[type=search]{width:100%}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font:600 .64rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.tools{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px var(--gutr) 10px var(--gut);display:flex;flex-direction:column;gap:10px;position:relative;z-index:12}
.tools .row1{display:flex;gap:8px;align-items:center}
.tools .row1 .grow{flex:1;min-width:0;position:relative}
.cg{display:flex;flex-direction:column;gap:6px;flex:1 1 100%;min-width:0;border:0;margin:0;padding:0}
.cg>legend{font:600 .64rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:0;margin-bottom:8px}
.cg-boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.cg-boxes.col{grid-template-columns:1fr}
.cbx{display:flex;gap:8px;align-items:center;min-height:34px;font-size:.86rem;cursor:pointer;line-height:1.25}
.cg>legend{display:flex;align-items:center;gap:6px}
.cg>legend .qa{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink2,var(--ink));border-radius:999px;
  font:500 .68rem/1 var(--f-body);letter-spacing:0;text-transform:none;padding:4px 9px;min-height:24px;cursor:pointer}
.cg>legend .qa:hover{border-color:var(--ink)}
.linkend{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:12px;min-height:56px;cursor:pointer;font-size:.95rem}
.linkend:hover{border-color:var(--ink)}
.linkend .le-txt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;text-align:left}
.linkmid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;text-align:center;font-size:.88rem}
.linkmid::before{content:'';width:2px;height:14px;background:var(--line2)}
.linkmid::after{content:'';width:2px;height:14px;background:var(--line2)}
.linkmid .k{font:500 .7rem/1.4 var(--f-mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.egobar{position:absolute;left:12px;right:12px;top:10px;z-index:6;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:.86rem;max-width:620px;margin:0 auto}
.egostep{display:inline-flex;align-items:center;gap:8px}
@media (max-width:899px){
  .egobar{left:8px;right:60px;top:8px;margin:0;padding:6px 8px;gap:6px 8px;font-size:.8rem;justify-content:flex-start}
  .egobar .btn.sm{min-height:34px;padding:0 10px}
  .egobar .btn.sm[aria-label]{width:34px;padding:0}
}
#panelFwd{display:none}#panelFwd.on{display:inline-flex}
#panelSize{display:none}
.theory h4{font:600 .66rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.tlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;line-height:1.4}
.find{font:600 .68rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.find.supported{color:#1a7f37}.find.contradicted{color:#b42318}.find.unclear{color:var(--ink3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .find.supported{color:#4ac26b}:root:not([data-theme="light"]) .find.contradicted{color:#ff7b72}}
:root[data-theme="dark"] .find.supported{color:#4ac26b}:root[data-theme="dark"] .find.contradicted{color:#ff7b72}
.edgetip{position:absolute;z-index:7;transform:translate(-50%,-130%);max-width:min(320px,80vw);appearance:none;border:1px solid var(--ink);
  background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:500 .78rem/1.35 var(--f-body);text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.edgetip .psub{font-size:.7rem}
.cbr{display:flex;align-items:center;gap:4px;min-width:0}
.cbr .cbx{flex:1;min-width:0}
.cbr .only{appearance:none;border:0;background:none;color:var(--ink3);font:500 .7rem/1 var(--f-body);padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.cbr .only:hover,.cbr .only:focus-visible{color:var(--ink)}
@media (hover:hover){.cbr .only{opacity:0}.cbr:hover .only,.cbr .only:focus-visible{opacity:1}}

.cbx input{width:18px;height:18px;flex:none;accent-color:var(--ink);margin:0}
.cg-hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cg-hd>span{font:600 .64rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cg-chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{cursor:pointer;min-height:34px;font-size:.8rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink2,var(--ink));font:500 .72rem/1 var(--f-body);padding:6px 10px;min-height:28px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cg input[type=range]{width:min(320px,100%)}
.tools .more{display:flex;gap:12px 10px;flex-wrap:wrap;align-items:flex-end}
.tools .more .fld{flex:1 1 150px;max-width:230px}
.tools .more .btn{align-self:flex-end}
.tools .filtbtn{display:none}
/* Web view: many filter groups, so they live in a drop-down panel over the graph on every screen size */
.tools.dd .filtbtn{display:inline-flex}
.tools.dd .more{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;max-height:min(72vh,640px);overflow:auto;
  background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.18);padding:14px var(--gutr) 16px var(--gut)}
.tools.dd.open .more{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px 22px;align-items:start}
.tools.dd .more .fld{max-width:none}
.tools.dd .more .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.tools .count{font:500 .78rem/1.3 var(--f-mono);color:var(--ink3);margin-left:auto;align-self:center}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);z-index:40;max-height:50vh;overflow:auto}
.sugg button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:none;padding:10px 12px;min-height:44px;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--surface2)}
.sugg button:last-child{border-bottom:0}
.sugg small{color:var(--ink3);margin-left:auto;font-size:.72rem;white-space:nowrap}

/* ---------- section heads ---------- */
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font:700 1.6rem/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.sec-h p{color:var(--ink3);font-size:.86rem;flex:1 1 280px}
.panelbox{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* ---------- panel photo ---------- */
.phead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.phead img{display:block;width:96px;height:auto;max-height:128px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.pcredit{font-size:.68rem;line-height:1.35;color:var(--ink3);margin-top:6px;overflow-wrap:anywhere}
.pcredit a{color:inherit;text-decoration:underline}
@media (max-width:600px){.phead{grid-template-columns:76px minmax(0,1fr);gap:12px}.phead img{width:76px;max-height:100px}}

/* ---------- findings view ---------- */
.rawbar{padding:8px var(--gut);font-size:.84rem;color:var(--ink2);border-bottom:1px solid var(--line);background:var(--surface)}
.rawbar a{color:var(--ink);text-decoration:underline}
.files{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;max-width:760px}
.files li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}
.files a{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.files .ftype{font:600 .7rem/1 var(--f-mono);color:var(--ink3);flex:none}
.fd-intro{max-width:70ch;color:var(--ink2);font-size:.95rem;margin-top:10px}
.fd-intro b{color:var(--ink)}
.fd-level{display:flex;flex-direction:column;gap:12px;max-width:960px}
.fd-items{display:flex;flex-direction:column;gap:10px;counter-reset:none}
.fd-item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fd-item .no{font:600 .8rem/1 var(--f-mono);width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;margin-top:1px}
.fd-item h3{font:600 1.02rem/1.3 var(--f-body);color:var(--ink)}
.fd-item p{color:var(--ink2);font-size:.92rem;line-height:1.5;margin-top:4px;max-width:75ch}
.fd-item details{grid-column:2;margin-top:6px}
.fd-item summary{cursor:pointer;font-size:.8rem;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;padding:4px 0;min-height:28px;display:flex;align-items:center;gap:6px;list-style:none}
.fd-item summary::-webkit-details-marker{display:none}
.fd-item summary::before{content:'\25B8';font-size:.8rem;transition:transform .15s;display:inline-block}
.fd-item details[open] summary::before{transform:rotate(90deg)}
.fd-ev{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fd-ev button{appearance:none;display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:.84rem;line-height:1.4;cursor:pointer}
.fd-ev button:hover{border-color:var(--ink3)}
.fd-ev .badge{flex:none}
.fd-ev .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.fd-ev .kind{flex:none;font:600 .66rem/1.6 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 5px}
.fd-stats{grid-column:2;margin-top:8px;border-collapse:collapse;font-size:.86rem;width:100%;max-width:620px;table-layout:fixed}
.fd-stats th:first-child,.fd-stats td:first-child{width:30%}
.fd-stats th,.fd-stats td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.fd-stats th:first-child,.fd-stats td:first-child{text-align:left}
.fd-stats th{font-weight:600;color:var(--ink3);font-size:.74rem;letter-spacing:.02em;vertical-align:bottom;line-height:1.25;overflow-wrap:normal;hyphens:manual;white-space:normal;text-transform:none}
.fd-bottom{background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:16px 18px;font-size:1rem;line-height:1.55;max-width:80ch}
.fd-bottom b{display:block;font:700 1.1rem/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
@media (max-width:600px){.fd-item{grid-template-columns:26px minmax(0,1fr);padding:12px 12px;gap:4px 10px}.fd-item .no{width:24px;height:24px}
  .fd-item details,.fd-stats{grid-column:1 / -1}.fd-stats th,.fd-stats td{padding:6px 3px}.fd-stats{font-size:.8rem}.fd-stats th{font-size:.66rem}}

/* ---------- start view ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.hero .lede{font:700 clamp(1.9rem,4.6vw,3rem)/1.02 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.howto{margin-top:16px;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.howto li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.95rem;color:var(--ink2)}
.howto li b{color:var(--ink)}
.howto .n{font:600 .75rem/1 var(--f-mono);width:22px;height:22px;border:1.5px solid var(--ink);display:grid;place-items:center;border-radius:50%;margin-top:2px;color:var(--ink)}
.built{margin-top:14px;font:500 .78rem/1.4 var(--f-mono);color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:74px}
button.tile:hover{border-color:var(--ink3)}
.tile .num{font:600 1.7rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tile .lab{font-size:.78rem;color:var(--ink3)}
.tiles.small{margin-top:8px}
.tiles.small .tile{min-height:0;flex-direction:row;align-items:baseline;gap:8px;padding:8px 12px}
.tiles.small .num{font-size:1.15rem}
.legend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.legend-grid>div{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:start;font-size:.86rem;color:var(--ink2)}
.legend-grid .badge{justify-self:start}
.tier-legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.84rem;color:var(--ink2)}
.tier-legend>span{display:inline-flex;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:start}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);
  background:none;padding:12px 14px;min-height:56px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .no{font:600 .8rem/1.7 var(--f-mono);color:var(--ink3);width:1.6em}
.row .txt{font-size:.92rem;line-height:1.45;display:block}
.row .by{display:block;margin-top:4px;font-size:.78rem;color:var(--ink3)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px;margin:0;padding:0;list-style:none}
.who li{font-size:.86rem;line-height:1.4;padding:6px 0;border-bottom:1px solid var(--line,rgba(127,127,127,.2))}
.who button{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.who button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.row .lead{display:flex;flex-direction:column;align-items:flex-start;gap:7px;width:112px}
.row .go{color:var(--ink3);align-self:center}
.row.official{grid-template-columns:1.6em minmax(0,1fr) auto}
.row.official .meta{margin-bottom:5px}

/* ---------- web view ---------- */
#v-web,#v-map{overflow:hidden;display:flex;flex-direction:column}
#v-web[hidden],#v-map[hidden]{display:none}
.stage{flex:1;min-height:0;position:relative;background:var(--surface)}
#graph{position:absolute;inset:0}
#graph canvas{outline:none}
.floaters{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.floaters .btn{box-shadow:var(--shadow)}
.stagemsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:10px 16px;font-size:.88rem;box-shadow:var(--shadow);z-index:6;text-align:center;max-width:80%}
.keyrow{flex:none;display:flex;gap:6px 14px;align-items:center;overflow-x:auto;white-space:nowrap;padding:7px var(--gutr) 7px var(--gut);background:var(--surface2);border-bottom:1px solid var(--line);font-size:.76rem;color:var(--ink2)}
.keyrow .k{display:inline-flex;align-items:center;gap:6px;flex:none}
.keyrow svg{width:18px;height:18px;flex:none}
.keyrow .sep{width:1px;height:16px;background:var(--line2);flex:none}
.edgekey{display:inline-block;width:28px;height:0;border-top-width:2px;border-top-style:solid;flex:none}
.graphnote{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font:500 .74rem/1.3 var(--f-mono);color:var(--ink2);z-index:5;max-width:calc(100% - 80px)}

/* ---------- timeline ---------- */
.tl-wrap{flex:1;min-height:0;position:relative}
.tl-scroll{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;cursor:grab;background:var(--surface)}
.tl-scroll.dragging{cursor:grabbing;user-select:none}
.tl-inner{position:relative}
.tl-axis{position:sticky;top:0;z-index:6;height:30px;background:var(--surface2);border-bottom:1px solid var(--line2)}
.tl-axis span{position:absolute;top:0;height:30px;padding-left:5px;border-left:1px solid var(--line2);font:500 .7rem/30px var(--f-mono);color:var(--ink2);white-space:nowrap}
.tl-grid{position:absolute;top:30px;bottom:0;left:0;right:0;pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tl-lane{position:relative;border-bottom:1px solid var(--line2)}
.tl-label{position:sticky;left:0;z-index:4;width:150px;height:100%;min-height:44px;background:var(--surface);border-right:1px solid var(--line2);padding:8px 10px;font:600 .8rem/1.25 var(--f-body);color:var(--ink);box-shadow:4px 0 8px -6px rgba(0,0,0,.25)}
.tl-label small{display:block;font:400 .68rem/1.3 var(--f-mono);color:var(--ink3);margin-top:3px}
.tl-item{position:absolute;appearance:none;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;height:34px;color:var(--ink);z-index:2}
.tl-item .mix{height:7px;flex:none}
.tl-item .lab{font-size:.74rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl-item .lab b{font:500 .68rem/1 var(--f-mono);color:var(--ink3);margin-right:5px;font-weight:500}
.tl-item:hover .lab,.tl-item:focus-visible .lab{text-decoration:underline}
.tl-item[aria-current="true"] .mix{outline:2px solid var(--ink);outline-offset:1px}
.tl-hint{position:absolute;left:12px;bottom:12px;z-index:8;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:.75rem;color:var(--ink2);box-shadow:var(--shadow)}
.tl-list{padding:0 var(--gutr) 24px var(--gut);display:flex;flex-direction:column}
.tl-yr{position:sticky;top:0;z-index:3;background:var(--bg);font:700 1.3rem/1 var(--f-display);letter-spacing:.05em;padding:12px 0 6px;border-bottom:2px solid var(--ink);margin-top:10px}
.tl-ev{appearance:none;display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 0;min-height:56px}
.tl-ev .d{font:500 .74rem/1.4 var(--f-mono);color:var(--ink2)}
.tl-ev .d small{display:block;color:var(--ink3);font-size:.66rem}
.tl-ev .t{font-size:.92rem;line-height:1.35}
.tl-ev .s{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tl-ev .s .mix{width:70px}
.tl-ev .s .chip{font-size:.7rem;min-height:22px;padding:1px 8px}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--map-bg);z-index:1}
.leaflet-container{font-family:var(--f-body);background:var(--map-bg)}
.leaflet-marker-icon.ml{background:none;border:0}
.ml{position:absolute;white-space:nowrap;overflow:visible;pointer-events:none;color:var(--map-label);font:500 11px/14px var(--f-body);
  text-shadow:0 0 2px var(--map-land),0 0 2px var(--map-land),0 0 3px var(--map-land)}
.ml.c{font:700 12.5px/15px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--map-label-strong)}
.ml.s{font:italic 500 11px/14px var(--f-body);letter-spacing:.03em;opacity:.9}
.ml.p::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px}
.ml.t{font:500 10.5px/13px var(--f-body)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.leaflet-tooltip{font:500 .78rem/1.2 var(--f-body);background:var(--surface);color:var(--ink);border-color:var(--line2)}
.leaflet-tooltip-top:before{border-top-color:var(--line2)}
.leaflet-bar a{width:36px;height:36px;line-height:36px}
.mapbtns{position:absolute;left:54px;top:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;right:12px;pointer-events:none}
.mapbtns .btn{pointer-events:auto;box-shadow:var(--shadow)}
.mapkey{position:absolute;left:10px;bottom:24px;z-index:5;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.72rem;color:var(--ink2);display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:210px}
.mapkey div{display:flex;align-items:center;gap:8px}
.mapkey svg{width:18px;height:18px;flex:none}
.maplist[hidden]{display:none}
.maplist{position:absolute;right:10px;top:56px;bottom:30px;width:300px;max-width:calc(100% - 20px);z-index:6;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.maplist h3{font:700 1rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:12px 14px 8px}
.maplist ul{overflow:auto;flex:1}
.maplist li button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;min-height:44px;font-size:.86rem}
.maplist li button:hover{background:var(--surface2)}
.maplist li small{margin-left:auto;color:var(--ink3);font-size:.7rem}

/* ---------- claims & sources ---------- */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font:600 .66rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td.st{width:150px}
td.st .dots{margin-top:7px;display:flex}
td.cl{min-width:340px;max-width:620px}
td.cl button,.linklike{appearance:none;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
td.cl button:hover,.linklike:hover{text-decoration:underline}
td.by{white-space:nowrap;color:var(--ink2)}
td.ep{white-space:nowrap}
td.ep a,.elink,.listen{display:inline-flex;align-items:center;gap:6px;font:500 .8rem/1 var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line2);border-radius:5px;padding:5px 8px;min-height:30px;background:var(--surface)}
td.ep a:hover,.elink:hover,.listen:hover{background:var(--surface2);border-color:var(--ink3)}
.btn{white-space:nowrap}
.ev-n{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.card .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .big{appearance:none;border:0;background:none;text-align:left;padding:0;font-size:.94rem;line-height:1.45}
.card .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.8rem;color:var(--ink2)}
.more-btn{align-self:center;margin-top:8px}
.srcmark{display:inline-flex;align-items:center;gap:4px;font-size:.78rem}
.srcmark.ok{color:var(--est-bg)}
.pill-x{display:inline-flex;gap:6px;align-items:center}

/* ---------- detail panel ---------- */
#scrim{display:none}
#panel:not(.anim),#scrim:not(.anim){transition:none !important}
#panel{flex:none;width:0;overflow:hidden;background:var(--surface);border-left:0;display:flex;flex-direction:column;position:relative;z-index:25}
#panel.open{width:410px;border-left:1px solid var(--line2)}
#panelHead{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);min-height:52px}
#panelHead .kind{font:600 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#panelBody{flex:1;overflow:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px;min-width:0;-webkit-overflow-scrolling:touch}
#panel>*{min-width:410px}
.pt{font:700 1.6rem/1.08 var(--f-display);letter-spacing:.015em;text-wrap:balance;overflow-wrap:anywhere}
.ptext{font-size:1.04rem;line-height:1.5;overflow-wrap:anywhere}
.psub{font-size:.84rem;color:var(--ink3)}
.psec h3{font:600 .68rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.psec h3 .n{font-family:var(--f-mono);letter-spacing:0}
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:.88rem}
.dl dt{color:var(--ink3);font-size:.78rem;padding-top:2px}
.dl dd{min-width:0;overflow-wrap:anywhere}
.quote{border-left:3px solid var(--ink);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:7px}
.quote q{quotes:"\201C" "\201D";font-size:.94rem;font-style:normal;line-height:1.5;color:var(--ink)}
.quote .cite{font-size:.78rem;color:var(--ink3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listen{align-self:flex-start;font-family:var(--f-body);font-weight:600;font-size:.84rem;min-height:44px;padding:0 12px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:.86rem}
.ev:first-of-type{border-top:0}
.ev .nt{grid-column:2;color:var(--ink2);font-size:.82rem}
.ev a{overflow-wrap:anywhere}
.note{font-size:.84rem;padding:9px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--ink2)}
.note.flag{border-style:dashed}
.rel,.pl{appearance:none;display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;min-height:44px;font-size:.86rem}
.rel:first-of-type,.pl:first-of-type{border-top:0}
.rel:hover .nm,.pl:hover .tt{text-decoration:underline}
.rel .k{font:500 .68rem/1.4 var(--f-mono);color:var(--ink3);flex:0 0 8.6em;width:8.6em;white-space:normal;overflow-wrap:break-word;hyphens:auto}
.rel .nm,.pl .tt{min-width:0;overflow-wrap:anywhere}
.rel .rl{display:block;font-size:.8rem;line-height:1.35;margin-top:2px}
.rel .rlv{font-weight:600;color:var(--ink2,var(--ink))}
.pl .dd{font:500 .72rem/1.4 var(--f-mono);color:var(--ink3);flex:none;min-width:7.5em}
details.grp{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:44px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .ic{margin-left:auto;transition:transform .15s}
details.grp[open]>summary .ic{transform:rotate(180deg)}
details.grp .items{padding:0 10px 4px}
.cl-row{appearance:none;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;font-size:.86rem;line-height:1.4}
.cl-row:hover .tx{text-decoration:underline}
.cl-row .top{display:flex;align-items:center;gap:8px;min-width:0}
.cl-row .top .psub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none}
.back.on{display:inline-flex}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .two{grid-template-columns:1fr;gap:30px}
}
@media (max-width:899px){
  :root{--headh:46px}
  #app{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
  .brand .sub{display:none}
  .brand h1{font-size:1.3rem}
  #tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:50;background:var(--surface);border-top:1px solid var(--line2);
    padding:0 var(--gutr) env(safe-area-inset-bottom,0px) var(--gut);justify-content:space-between;gap:0}
  .tab{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;font-size:.72rem;letter-spacing:.05em;min-height:var(--navh);min-width:44px}
  .tab .ic{width:21px;height:21px}
  .tab[aria-selected="true"]::after{left:20%;right:20%;top:-1px;bottom:auto}
  .tab[aria-selected="true"]{background:var(--surface2)}
  #legendbar{padding-top:4px;padding-bottom:4px}
  #legToggle{display:inline-flex;margin-left:auto}
  #legendbar .lg-title{display:none}
  #legendbar.collapsed .lg-chips,#legendbar.collapsed .lg-tiers{display:none}
  #legendbar:not(.collapsed){padding-bottom:10px}
  #legendbar .lg-tiers{margin-left:0;width:100%}
  .page{padding-top:16px;gap:26px}
  .legend-grid{grid-template-columns:1fr}
  .legend-grid>div{grid-template-columns:128px 1fr}
  .tools .filtbtn{display:inline-flex}
  .tools .more{display:none}
  .tools.open .more{display:flex}
  .tools .more .fld{flex:1 1 42%;max-width:none}
  .tools .count{margin-left:0;width:100%}
  /* detail panel becomes a sheet */
  #panel{position:fixed;left:0;right:0;bottom:0;top:0;width:auto !important;border:0 !important;transform:translateY(102%);visibility:hidden;
    transition:transform .22s ease,visibility 0s .22s;z-index:60;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  #panel>*{min-width:0}
  #panelHead{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:var(--gut);padding-right:var(--gutr)}
  #panelBody{padding-left:var(--gut);padding-right:var(--gutr)}
  #scrim{display:block;position:fixed;inset:0;background:rgba(5,8,12,.5);z-index:55;opacity:0;visibility:hidden;transition:opacity .2s}
  #scrim.on{opacity:1;visibility:visible}
  /* preview ("peek") sheet: the graph or map stays visible above it */
  #panel.peek{top:auto;height:min(40vh,400px);border-radius:14px 14px 0 0;border-top:1px solid var(--line2) !important;box-shadow:0 -8px 28px rgba(0,0,0,.25)}
  #panel.peek #panelHead{padding-top:8px}
  #panelSize{display:inline-flex}
  .maplist{top:auto;bottom:30px;height:52%;right:10px}
  .back.on{display:inline-flex}
  .floaters{top:10px;right:10px}
  .btn.sm{min-height:44px}
  .btn.sm.icon{width:44px}
  td.ep a,.elink,.listen{min-height:44px}
  .card a{display:inline-block;padding:11px 0}
}
@media (min-width:600px) and (max-width:899px){
  #panel{left:50%;right:auto;width:min(680px,100%) !important;transform:translate(-50%,102%);top:6vh;border-radius:14px 14px 0 0;border:1px solid var(--line2) !important;box-shadow:var(--shadow)}
  #panel.open{transform:translate(-50%,0)}
  #panel.peek{top:auto;height:min(44vh,440px)}
  #panelHead{padding-top:8px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{padding:12px}
  .dl{grid-template-columns:84px minmax(0,1fr)}
  .rel .k{flex-basis:7.6em;width:7.6em}
}
@media (min-width:900px){
  #legendbar .lg-title{display:block}
  .tools:not(.dd) .more{display:flex !important}
  .tools{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
  .tools .row1{flex:none}
  .tools .row1 .grow{width:330px;max-width:100%;flex:none}
  .tools .more{flex:0 1 auto}
  .tools .count{margin-left:auto;align-self:center}
  .page.wide{max-width:none}
  #gfoot{display:block}
  .page .foot,.tl-list .foot{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}

function parseHash(){
  var hs=location.hash.replace(/^#/,''),r={tab:R.tab,kind:null,id:null};
  if(!hs)return r;
  if(hs.indexOf('=')<0){if(TABK.indexOf(hs)>=0)r.tab=hs;return r;}
  var p;try{p=new URLSearchParams(hs);}catch(e){return r;}
  var t=p.get('tab');if(t&&TABK.indexOf(t)>=0)r.tab=t;
  KINDS.forEach(function(k){if(p.get(k)){r.kind=k;r.id=p.get(k);}});

/* the address bar never names what is open: routes live in history.state only, so browser history and synced history

function bareURL(){return EMBED?location.href:location.pathname+location.search;}
function setRoute(r,mode){
  var depth=(history.state&&history.state.p)||0;

    if(mode==='push'){history.pushState({p:r.kind?depth+1:0,r:r},'',h2);NAV.max=r.kind?depth+1:0;}
    else history.replaceState({p:r.kind?depth:0,r:r},'',h2);

function setPeek(on,quiet){
  var p=$('#panel');p.classList.toggle('peek',!!on);
  var b=$('#panelSize');b.textContent=on?'Expand':'Collapse';b.setAttribute('aria-label',on?'Expand details':'Collapse details');
  $('#scrim').classList.toggle('on',p.classList.contains('open')&&!mqDesk.matches&&!on);
  if(!quiet&&on&&R.tab==='web'&&G.net)keepVisible();
}
function renderPanel(){
  var p=$('#panel'),body=$('#panelBody'),open=!!R.kind;
  var was=p.classList.contains('open');
  if(open&&!was){panelOpenedAt=Date.now();setPeek(!mqDesk.matches&&(R.tab==='web'||R.tab==='map'),true);}
  p.classList.toggle('open',open);
  $('#scrim').classList.toggle('on',open&&!mqDesk.matches&&!$('#panel').classList.contains('peek'));
  var dep=(history.state&&history.state.p)||0;
  $('#panelBack').classList.toggle('on',open&&dep>1);
  $('#panelFwd').classList.toggle('on',open&&dep<NAV.max);
  if(!open){
    if(was&&lastFocus&&document.contains(lastFocus)){try{lastFocus.focus({preventScroll:true});}catch(e){}}
    p.setAttribute('aria-hidden','true');p.inert=true;
    notifyResize();return;
  }
  p.removeAttribute('aria-hidden');p.inert=false;
  if(!was)lastFocus=document.activeElement;
  var kindEl=$('#panelKind');clear(kindEl);clear(body);
  var ok=false;
  if(R.kind==='claim'&&C.has(R.id)){panelClaim(C.get(R.id),kindEl,body);ok=true;}
  else if(R.kind==='node'&&E.has(R.id)){panelNode(E.get(R.id),kindEl,body);ok=true;}
  else if(R.kind==='event'&&EV.has(R.id)){panelEvent(EV.get(R.id),kindEl,body);ok=true;}
  else if(R.kind==='link'&&RELID.has(R.id)){panelLink(RELID.get(R.id),kindEl,body);ok=true;}
  if(!ok){kindEl.textContent='Not found';body.append(h('p',{class:'ptext'},'No item with the id "'+R.id+'" is in this build of the map.'));}
  body.scrollTop=0;
  if(!was){setTimeout(function(){try{$('#panelClose').focus({preventScroll:true});}catch(e){}},30);}
  notifyResize();
}

    inner.append(h('div',{class:'cards'},res.map(function(s){
      return h('article',{class:'card'},h('div',{class:'top'},tier(s.tier),h('span',{class:'mono psub'},s.date||''),h('span',{style:'margin-left:auto'},verMark(s))),
        h('div',{style:'font-size:.94rem;line-height:1.4;overflow-wrap:anywhere'},link(s)),
        h('div',{class:'meta'},h('span',null,[s.pub,s.author].filter(Boolean).join(' · ')),citeBtn(s)));
    })));
  }
  inner.append(footer());
}

/* ================= boot ================= */
function boot(){
  buildShell();
  R=parseHash();
  /* replace state so history.state.p exists */
  /* depth 0 so close clears a deep-linked panel; in an iframe leave the host's URL alone */
  try{history.replaceState({p:0,r:R},'',bareURL());}catch(e){}
  render();
  setTimeout(function(){$('#panel').classList.add('anim');$('#scrim').classList.add('anim');},700);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

</script>
